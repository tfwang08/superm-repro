name: Tests

on:
  push:
  pull_request:

jobs:
  unit-and-mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project with MuJoCo
        run: python -m pip install -e ".[dev,sim]"
      - name: Run tests
        run: python -m pytest -q
